<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">拾知鱼形图标</title>
  <desc id="desc">一条由知识页面与信息流构成的扁平化鱼，象征浏览、拾取、理解和归档知识。</desc>

  <!-- 温和的圆形底板，适配项目当前的圆形悬浮入口 -->
  <circle cx="512" cy="512" r="456" fill="#F4FAF8"/>

  <!-- 尾鳍：两片被拾取的信息碎片 -->
  <path d="M354 505C278 478 207 409 180 318C278 337 356 386 405 456L354 505Z" fill="#1FC7A5"/>
  <path d="M354 519C278 547 207 615 180 706C278 688 356 638 405 568L354 519Z" fill="#1FC7A5"/>
  <path d="M344 512C304 485 273 459 249 432C303 444 348 465 385 493L344 512Z" fill="#0D3556" opacity=".18"/>
  <path d="M344 512C304 539 273 565 249 592C303 580 348 559 385 531L344 512Z" fill="#0D3556" opacity=".18"/>

  <!-- 鱼身：稳定的知识容器 -->
  <path d="M319 512C383 351 542 277 708 326C799 353 866 419 902 512C857 598 786 655 697 681C533 728 382 652 319 512Z" fill="#123B5D"/>

  <!-- 鱼腹中的负形是一张翻起的知识页，也像向前流动的水纹 -->
  <path d="M397 476C478 390 600 379 728 431C655 434 593 466 543 518C496 567 451 593 388 577C433 553 449 525 397 476Z" fill="#FFFFFF"/>
  <path d="M543 518C583 479 633 454 688 443C644 469 616 503 600 548C581 535 562 525 543 518Z" fill="#1FC7A5"/>

  <!-- 眼睛 -->
  <circle cx="753" cy="424" r="30" fill="#FFFFFF"/>
  <circle cx="760" cy="426" r="12" fill="#1FC7A5"/>

  <!-- 嘴部留白，让轮廓在小尺寸下仍有方向感 -->
  <path d="M848 520C868 512 886 512 902 512C888 532 869 544 844 548C851 538 852 529 848 520Z" fill="#F4FAF8"/>

  <!-- 信息拾取点：网页片段进入知识流 -->
  <rect x="212" y="253" width="44" height="44" rx="14" transform="rotate(-14 212 253)" fill="#1FC7A5"/>
  <rect x="278" y="230" width="27" height="27" rx="9" transform="rotate(10 278 230)" fill="#123B5D" opacity=".78"/>
</svg>
